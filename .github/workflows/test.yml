name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: change_of_bid
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d change_of_bid"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/change_of_bid
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-32chars
      BETTER_AUTH_URL: http://localhost:3001
      PAGE_ORIGIN: http://localhost:3000
      BID_HASH_SECRET: ci-only-bid-hash-secret-32characters

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Run migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm test
