name: Fallow

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  audit:
    name: Audit changed code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fallow audit
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          fail-on-issues: false
